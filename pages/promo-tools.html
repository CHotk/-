<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef1f5">
<title>課程推廣工具</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap">
<style>
/* 版面：實用的工作檯。頂部分頁（頻道篩選表／合作信），手機單欄、桌機雙欄。分數用顏色與環形圖一眼看出優先順序。資料只存在你自己的瀏覽器 */
:root{
  --bg:#eef1f5; --card:#fff; --ink:#14213d; --mute:#6a7488; --line:#d9dfe8; --acc:#2563eb; --acc2:#1d4ed8;
  --good:#12a150; --warn:#d98a00; --bad:#d6342c; --soft:#f6f8fb;
  --sans:'Noto Sans TC',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace;
  --gut:clamp(14px,4vw,40px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{color-scheme:light}
body{background:var(--bg);color:var(--ink);font:400 14.5px/1.7 var(--sans);overflow-x:hidden;-webkit-text-size-adjust:100%;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 40px)}
button,input,select,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;touch-action:manipulation}
.top{padding:calc(env(safe-area-inset-top,0px) + 14px) var(--gut) 10px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.top h1{font:900 22px var(--sans);letter-spacing:-.02em}.top small{font:400 12px var(--mono);color:var(--mute)}
.tabs{position:sticky;top:0;z-index:50;display:flex;gap:6px;padding:8px var(--gut);background:rgba(238,241,245,.9);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.tabs button{flex:1;max-width:220px;min-height:44px;border-radius:12px;font:700 14px var(--sans);color:var(--mute);background:transparent;transition:.2s}
.tabs button[aria-selected=true]{background:var(--ink);color:#fff}
main{max-width:1100px;margin-inline:auto;padding:16px var(--gut) 0}
.note{font:400 12px/1.7 var(--sans);color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 18px;border-radius:12px;background:var(--acc);color:#fff;font:700 14px var(--sans);transition:transform .15s,background .2s}
.btn:hover{background:var(--acc2)}.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}.btn.ghost:hover{background:var(--soft)}
.btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn.danger{color:var(--bad)}
label.f{display:grid;gap:4px;font:500 12px var(--sans);color:var(--mute)}
input[type=text],input[type=number],input[type=date],input[type=url],select,textarea{width:100%;min-height:44px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:16px;color:var(--ink);outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px rgba(37,99,235,.15)}
textarea{min-height:120px;line-height:1.7;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}.grid3{grid-template-columns:1fr 1fr}}

/* 漏斗統計 */
.funnel{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}
.funnel div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.funnel b{display:block;font:500 22px var(--mono);letter-spacing:-.04em}.funnel small{font-size:11.5px;color:var(--mute)}
@media(max-width:560px){.funnel{grid-template-columns:repeat(5,1fr);gap:5px}.funnel b{font-size:18px}.funnel small{font-size:10.5px}}
.tool{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tool input[type=text]{flex:1;min-width:150px}.tool select{width:auto;min-width:112px}
.chk{display:flex;align-items:center;gap:8px;min-height:44px;font-size:13.5px}
.chk input{width:20px;height:20px;accent-color:var(--acc);flex:none}
/* 表單 */
.form{margin-bottom:14px;display:grid;gap:12px}.form[hidden]{display:none}
.form h3{font:900 16px var(--sans)}
.checks{display:grid;grid-template-columns:1fr 1fr;gap:0 14px;background:var(--soft);border-radius:12px;padding:6px 12px}
@media(max-width:560px){.checks{grid-template-columns:1fr}}
.checks .chk.bad span{color:var(--bad);font-weight:700}
.actions{display:flex;gap:8px;flex-wrap:wrap}
/* 頻道卡 */
.list{display:grid;gap:10px}
.ch{display:grid;grid-template-columns:auto 1fr;gap:14px;padding:14px;position:relative}
.ch.ex{opacity:.6;background:repeating-linear-gradient(135deg,#fff 0 10px,#f8f0f0 10px 20px)}
.ring{width:58px;height:58px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),#e6eaf1 0);display:grid;place-items:center;flex:none}
.ring span{width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;font:500 15px var(--mono)}
.ch h3{font:700 16px/1.3 var(--sans);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ch h3 a{color:var(--acc);font:400 12px var(--mono);text-decoration:none}
.meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tg{font:500 11.5px var(--sans);padding:2px 9px;border-radius:99px;background:var(--soft);border:1px solid var(--line);color:var(--mute)}
.tg.good{background:#e6f6ec;border-color:#bfe6cd;color:#0e7a3c}.tg.warn{background:#fff3da;border-color:#f1d9a0;color:#9a6200}.tg.bad{background:#fdebea;border-color:#f3c4c1;color:#b02820}
.ch .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.ch .row select{width:auto;min-height:36px;padding:4px 10px;font-size:14px;border-radius:10px}
.ch p.nt{font-size:13px;color:var(--mute);margin-top:6px}
.due{font:500 11.5px var(--sans);color:#fff;background:var(--bad);border-radius:99px;padding:2px 9px}
.empty{text-align:center;color:var(--mute);padding:40px 10px}
details.bk{margin-top:16px}details.bk summary{cursor:pointer;font:700 14px var(--sans);padding:10px 0;min-height:44px;display:flex;align-items:center}
details.bk .in{display:grid;gap:8px}

/* 合作信 */
.lg{display:grid;grid-template-columns:1fr 1.15fr;gap:14px;align-items:start}
@media(max-width:860px){.lg{grid-template-columns:1fr}}
.seg{display:flex;padding:3px;border-radius:12px;background:#dfe5ee;gap:3px}
.seg button{flex:1;min-height:40px;border-radius:10px;font:700 13px var(--sans);color:var(--mute);transition:.2s;padding:0 6px}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.fl{display:grid;gap:12px}
.out{position:sticky;top:64px}
@media(max-width:860px){.out{position:static}}
.out textarea{min-height:420px;font-size:14.5px;background:#fff}
.pill{display:inline-flex;align-items:center;gap:6px;font:500 12px var(--sans);padding:3px 10px;border-radius:99px}
.pill.todo{background:#fff3da;color:#9a6200}.pill.ok{background:#e6f6ec;color:#0e7a3c}
.calc{font:400 13px/1.8 var(--mono);background:var(--soft);border-radius:12px;padding:10px 12px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);transform:translate(-50%,30px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:99px;font:500 13px var(--sans);opacity:0;pointer-events:none;transition:.4s cubic-bezier(.2,.8,.1,1);z-index:900;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<header class="top"><h1>課程推廣工具</h1><small>頻道篩選表 ・ 合作信</small></header>
<div class="tabs" role="tablist"><button role="tab" id="tabL" aria-selected="true" data-tab="list">頻道篩選表</button><button role="tab" id="tabW" aria-selected="false" data-tab="letter">合作信</button></div>

<main>
<!-- ============ 篩選表 ============ -->
<section id="tab-list" role="tabpanel">
  <div class="funnel" id="funnel"></div>
  <div class="tool">
    <input type="text" id="q" placeholder="搜尋頻道名稱或備註" aria-label="搜尋">
    <select id="fCat" aria-label="類型"></select>
    <select id="fSt" aria-label="狀態"></select>
    <button class="btn" id="add">＋ 新增頻道</button>
  </div>
  <label class="chk"><input type="checkbox" id="fEx"><span>顯示已排除（賣類似課程）的頻道</span></label>

  <form class="card form" id="form" hidden onsubmit="return false">
    <h3 id="fTitle">新增頻道</h3>
    <div class="grid2"><label class="f">頻道名稱<input type="text" id="cName" placeholder="例如：接案小日常" autocomplete="off"></label>
      <label class="f">頻道網址（選填）<input type="url" id="cUrl" placeholder="https://youtube.com/@..." autocomplete="off"></label></div>
    <div class="grid3"><label class="f">類型<select id="cCat"></select></label>
      <label class="f">訂閱數<input type="number" id="cSubs" inputmode="numeric" min="0" placeholder="例如 12000"></label>
      <label class="f">近 10 支平均觀看<input type="number" id="cAvg" inputmode="numeric" min="0" placeholder="例如 1800"></label></div>
    <div class="checks" id="checks"></div>
    <div class="grid2"><label class="f">聯絡方式（信箱、IG、LINE）<input type="text" id="cContact" autocomplete="off"></label>
      <label class="f">下次追蹤日<input type="date" id="cNext"></label></div>
    <label class="f">備註<input type="text" id="cNote" placeholder="例如：最近有一支影片談接案報價，適合當切入點" autocomplete="off"></label>
    <div class="actions"><button class="btn" id="save" type="button">儲存</button><button class="btn ghost" id="cancel" type="button">取消</button></div>
  </form>

  <div class="list" id="list"></div>
  <details class="card bk"><summary>備份與還原</summary><div class="in">
    <p class="note">資料只存在這個瀏覽器，清除網站資料就會消失。請定期複製備份，存在自己的筆記裡。</p>
    <textarea id="bkArea" placeholder="還原時，把備份文字貼在這裡，再按「還原」" aria-label="備份文字"></textarea>
    <div class="actions"><button class="btn ghost sm" id="bkCopy">複製備份</button><button class="btn ghost sm" id="csvCopy">複製成表格（CSV）</button><button class="btn sm" id="bkRestore">還原</button><button class="btn ghost sm danger" id="clearDemo">清除範例資料</button></div>
  </div></details>
  <p class="note" style="margin-top:14px">分數說明：規模 3 千到 3 萬訂閱（2）、觀看數佔訂閱 10% 以上（2）、互動活躍（2）、近期更新（1）、內容品質（1）、有聯絡方式（1）、受眾在台灣（1）、沒賣類似課程（3）。滿分 13。若頻道有賣類似課程，直接排除。範例資料為虛構。</p>
</section>

<!-- ============ 合作信 ============ -->
<section id="tab-letter" role="tabpanel" hidden>
  <div class="lg">
    <div class="fl">
      <div class="card fl">
        <div class="seg" id="segCat" role="group" aria-label="頻道類型"></div>
        <label class="f">從篩選表帶入頻道（選填）<select id="pick"></select></label>
        <div class="grid2"><label class="f">頻道主稱呼<input type="text" id="vHost" placeholder="例如：小明" autocomplete="off"></label>
          <label class="f">頻道名稱<input type="text" id="vChan" autocomplete="off"></label></div>
        <label class="f">看過的影片名稱（越具體越好）<input type="text" id="vVideo" placeholder="例如：第一次接案怎麼報價" autocomplete="off"></label>
      </div>
      <div class="card fl">
        <h3 style="font:900 15px var(--sans)">你的資料</h3>
        <div class="grid2"><label class="f">你的名字<input type="text" id="vMe" autocomplete="name"></label>
          <label class="f">聯絡方式<input type="text" id="vContact" placeholder="信箱或 LINE" autocomplete="off"></label></div>
        <label class="f">課程名稱<input type="text" id="vCourse" placeholder="例如：用 AI 做出你的第一個店家官網"></label>
        <div class="grid3"><label class="f">日期<input type="text" id="vDate" placeholder="例如 10/26 晚上"></label>
          <label class="f">名額<input type="number" id="vSeats" inputmode="numeric" min="1" value="10"></label>
          <label class="f">售價（元）<input type="number" id="vPrice" inputmode="numeric" min="0" placeholder="1200"></label></div>
      </div>
      <div class="card fl">
        <h3 style="font:900 15px var(--sans)">分潤條件</h3>
        <div class="grid3"><label class="f">基本分潤 %<input type="number" id="t1" inputmode="numeric" min="0" max="100" value="30"></label>
          <label class="f">滿幾位提高<input type="number" id="n2" inputmode="numeric" min="1" value="5"></label><label class="f">提高到 %<input type="number" id="t2" inputmode="numeric" min="0" max="100" value="40"></label></div>
        <div class="grid3"><label class="f">再滿幾位提高<input type="number" id="n3" inputmode="numeric" min="1" value="15"></label><label class="f">提高到 %<input type="number" id="t3" inputmode="numeric" min="0" max="100" value="50"></label>
          <label class="f">歸因期（天）<input type="number" id="win" inputmode="numeric" min="1" value="14"></label></div>
        <label class="chk"><input type="checkbox" id="terms" checked><span>信末附上分潤條件</span></label>
        <div class="calc" id="calc"></div>
      </div>
    </div>
    <div class="card out fl">
      <div class="seg" id="segKind" role="group" aria-label="信件類型"></div>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><span class="pill" id="todo"></span><span class="note">可直接在下方修改文字</span></div>
      <textarea id="out" aria-label="信件內容"></textarea>
      <div class="actions"><button class="btn" id="copy">複製信件</button><button class="btn ghost" id="mark">標記為已寄信</button></div>
      <p class="note">信的內容不含任何收入承諾。合作內容請依規範在影片與連結說明中明確標示為合作。</p>
    </div>
  </div>
</section>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
let tt;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2000)}
async function copyText(text,ta){try{await navigator.clipboard.writeText(text);toast('已複製')}catch(e){if(ta){ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(x){}toast(ok?'已複製':'請長按文字手動複製')}else toast('請長按文字手動複製')}}
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ---------- 常數 ---------- */
const CATS={freelance:'接案・副業',design:'設計・網頁・工具',shop:'小店經營・行銷',life:'生活・效率',other:'其他'};
const STAT=['待聯絡','已寄信','已回覆','談成','婉拒'];
const CHECKS=[['interact','留言有真實互動（頻道主有回覆）'],['recent','最近仍穩定更新'],['quality','內容品質好、不誇大獲利'],['region','主要觀眾在台灣（繁體中文）']];

/* ---------- 資料 ---------- */
let CH=store.get('promo-ch',null);
if(!CH){CH=[
 {id:1,demo:1,name:'（範例）接案小日常',url:'',cat:'freelance',subs:12400,avg:1900,interact:1,recent:1,quality:1,region:1,sells:0,contact:'商務信箱在簡介',status:'待聯絡',next:'',note:'最近有一支談接案報價，適合當切入點'},
 {id:2,demo:1,name:'（範例）UI 設計筆記',url:'',cat:'design',subs:5200,avg:380,interact:1,recent:0,quality:1,region:1,sells:0,contact:'IG 私訊',status:'已寄信',next:'',note:'更新變少，可再觀察'},
 {id:3,demo:1,name:'（範例）AI 速成班',url:'',cat:'other',subs:21000,avg:4200,interact:1,recent:1,quality:1,region:1,sells:1,contact:'',status:'待聯絡',next:'',note:'他們自己在賣 AI 課程，是競爭者'}]; store.set('promo-ch',CH)}
const save=()=>store.set('promo-ch',CH);

/* ---------- 評分 ---------- */
function score(c){
  let p=0;const subs=+c.subs||0,avg=+c.avg||0,r=subs?avg/subs:0;
  if(subs>=3000&&subs<=30000)p+=2;else if((subs>=1000&&subs<3000)||(subs>30000&&subs<=60000))p+=1;
  if(r>=.1)p+=2;else if(r>=.05)p+=1;
  if(c.interact)p+=2;if(c.recent)p+=1;if(c.quality)p+=1;if(c.region)p+=1;if((c.contact||'').trim())p+=1;
  if(!c.sells)p+=3;
  const pct=Math.round(p/13*100);
  const grade=c.sells?'排除':pct>=70?'推薦':pct>=45?'可考慮':'略過';
  return{pct,grade,color:c.sells?'#9aa3b2':pct>=70?'var(--good)':pct>=45?'var(--warn)':'var(--bad)',ratio:r}}

/* ---------- 篩選表 UI ---------- */
function fillSelect(sel,opts,first){sel.innerHTML=(first?`<option value="">${first}</option>`:'')+Object.entries(opts).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}
fillSelect($('#fCat'),CATS,'全部類型');fillSelect($('#cCat'),CATS);
$('#fSt').innerHTML='<option value="">全部狀態</option>'+STAT.map(s=>`<option>${s}</option>`).join('');
$('#checks').innerHTML=CHECKS.map(([k,l])=>`<label class="chk"><input type="checkbox" id="k_${k}"><span>${l}</span></label>`).join('')+'<label class="chk bad"><input type="checkbox" id="k_sells"><span>他們也在賣類似的課程（會被排除）</span></label>';
let editing=null;
function openForm(c){editing=c?c.id:null;$('#fTitle').textContent=c?'編輯頻道':'新增頻道';const v=c||{cat:'freelance'};
  $('#cName').value=v.name||'';$('#cUrl').value=v.url||'';$('#cCat').value=v.cat;$('#cSubs').value=v.subs||'';$('#cAvg').value=v.avg||'';$('#cContact').value=v.contact||'';$('#cNext').value=v.next||'';$('#cNote').value=v.note||'';
  CHECKS.forEach(([k])=>$('#k_'+k).checked=!!v[k]);$('#k_sells').checked=!!v.sells;
  $('#form').hidden=false;$('#form').scrollIntoView({behavior:'smooth',block:'start'});$('#cName').focus({preventScroll:true})}
$('#add').onclick=()=>openForm(null);$('#cancel').onclick=()=>$('#form').hidden=true;
$('#save').onclick=()=>{const name=$('#cName').value.trim();if(!name){toast('請填寫頻道名稱');$('#cName').focus();return}
  const o={name,url:$('#cUrl').value.trim(),cat:$('#cCat').value,subs:+$('#cSubs').value||0,avg:+$('#cAvg').value||0,contact:$('#cContact').value.trim(),next:$('#cNext').value,note:$('#cNote').value.trim(),sells:$('#k_sells').checked?1:0};
  CHECKS.forEach(([k])=>o[k]=$('#k_'+k).checked?1:0);
  if(editing){const c=CH.find(x=>x.id===editing);Object.assign(c,o)}else CH.push({id:Date.now(),status:'待聯絡',...o});
  save();$('#form').hidden=true;render();toast('已儲存')};
function render(){
  const q=$('#q').value.trim().toLowerCase(),fc=$('#fCat').value,fs=$('#fSt').value,showEx=$('#fEx').checked;
  const all=CH.map(c=>({c,s:score(c)}));
  const live=all.filter(x=>x.s.grade!=='排除');
  $('#funnel').innerHTML=[['候選',live.length],['推薦',live.filter(x=>x.s.grade==='推薦').length],['已寄信',CH.filter(c=>c.status==='已寄信').length],['已回覆',CH.filter(c=>c.status==='已回覆').length],['談成',CH.filter(c=>c.status==='談成').length]].map(([l,n])=>`<div><b>${n}</b><small>${l}</small></div>`).join('');
  const rows=all.filter(({c,s})=>(showEx||s.grade!=='排除')&&(!fc||c.cat===fc)&&(!fs||c.status===fs)&&(!q||(c.name+(c.note||'')).toLowerCase().includes(q)))
    .sort((a,b)=>(a.s.grade==='排除')-(b.s.grade==='排除')||b.s.pct-a.s.pct);
  const today=new Date().toISOString().slice(0,10);
  $('#list').innerHTML=rows.length?rows.map(({c,s})=>{const due=c.next&&c.next<=today&&c.status==='已寄信';
    const tags=[`<span class="tg ${s.grade==='推薦'?'good':s.grade==='可考慮'?'warn':'bad'}">${s.grade}</span>`,`<span class="tg">${CATS[c.cat]}</span>`,
      c.subs?`<span class="tg">${(+c.subs).toLocaleString()} 訂閱</span>`:'',c.avg?`<span class="tg">均觀看 ${(+c.avg).toLocaleString()}${s.ratio?`（${Math.round(s.ratio*100)}%）`:''}</span>`:'',
      c.contact?`<span class="tg">${esc(c.contact)}</span>`:'<span class="tg bad">缺聯絡方式</span>',due?'<span class="due">該追蹤了</span>':''].join('');
    return `<article class="card ch${s.grade==='排除'?' ex':''}" data-id="${c.id}"><div class="ring" style="--p:${s.pct};--c:${s.color}"><span>${s.pct}</span></div>
      <div><h3>${esc(c.name)}${c.url?`<a href="${esc(c.url)}" target="_blank" rel="noopener">開啟 ↗</a>`:''}</h3><div class="meta">${tags}</div>${c.note?`<p class="nt">${esc(c.note)}</p>`:''}
      <div class="row"><select data-st aria-label="狀態">${STAT.map(x=>`<option${x===c.status?' selected':''}>${x}</option>`).join('')}</select>
      <button class="btn sm" data-letter>寫信</button><button class="btn ghost sm" data-edit>編輯</button><button class="btn ghost sm danger" data-del>刪除</button></div></div></article>`}).join(''):'<p class="empty">還沒有符合條件的頻道。按「＋ 新增頻道」開始建立你的名單。</p>';
  refreshPick()}
const esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
$('#list').addEventListener('click',e=>{const a=e.target.closest('article');if(!a)return;const c=CH.find(x=>x.id==a.dataset.id);
  if(e.target.closest('[data-edit]'))openForm(c);
  else if(e.target.closest('[data-del]')){if(a.dataset.sure){CH=CH.filter(x=>x!==c);save();render();toast('已刪除')}else{a.dataset.sure=1;const b=e.target.closest('[data-del]');b.textContent='再按一次確認';setTimeout(()=>{delete a.dataset.sure;b.textContent='刪除'},2500)}}
  else if(e.target.closest('[data-letter]')){selectChan(c.id);tab('letter')}});
$('#list').addEventListener('change',e=>{if(!e.target.matches('[data-st]'))return;const a=e.target.closest('article'),c=CH.find(x=>x.id==a.dataset.id);c.status=e.target.value;
  if(c.status==='已寄信'&&!c.next){const d=new Date();d.setDate(d.getDate()+7);c.next=d.toISOString().slice(0,10)}save();render()});
['q','fCat','fSt','fEx'].forEach(id=>$('#'+id).addEventListener('input',render));
/* 備份 */
$('#bkCopy').onclick=()=>{$('#bkArea').value=JSON.stringify(CH);copyText($('#bkArea').value,$('#bkArea'))};
$('#csvCopy').onclick=()=>{const h=['名稱','網址','類型','訂閱數','平均觀看','聯絡方式','狀態','分數','評等','下次追蹤','備註'];const q=v=>`"${String(v??'').replace(/"/g,'""')}"`;
  const t=[h.map(q).join(',')].concat(CH.map(c=>{const s=score(c);return[c.name,c.url,CATS[c.cat],c.subs,c.avg,c.contact,c.status,s.pct,s.grade,c.next,c.note].map(q).join(',')})).join('\n');$('#bkArea').value=t;copyText(t,$('#bkArea'))};
$('#bkRestore').onclick=()=>{try{const d=JSON.parse($('#bkArea').value);if(!Array.isArray(d))throw 0;CH=d;save();render();toast('已還原 '+d.length+' 筆')}catch(e){toast('格式不正確，請貼上完整的備份文字')}};
$('#clearDemo').onclick=()=>{CH=CH.filter(c=>!c.demo);save();render();toast('已清除範例資料')};

/* ---------- 分頁 ---------- */
function tab(n){$('#tab-list').hidden=n!=='list';$('#tab-letter').hidden=n!=='letter';$('#tabL').setAttribute('aria-selected',n==='list');$('#tabW').setAttribute('aria-selected',n==='letter');scrollTo({top:0});if(n==='letter')compose()}
$$('.tabs button').forEach(b=>b.onclick=()=>tab(b.dataset.tab));

/* ---------- 合作信 ---------- */
const LS=store.get('promo-letter',{cat:'freelance',kind:'full',me:'',contact:'',course:'用 AI 做出你的第一個店家官網',date:'',seats:10,price:'',t1:30,n2:5,t2:40,n3:15,t3:50,win:14,terms:true});
const HOOK={freelance:'我覺得你的觀眾和我想幫的對象很像：想用自己的技能增加收入，但不知道怎麼用 AI 加快做事的速度。',
  design:'你的觀眾已經在學工具，而我想補上的是「用 AI 把設計與網頁做得更快」這一塊。',
  shop:'你的觀眾是經營小店的人，而我做的事，就是幫小店用 AI 低成本做出像樣的官網。',
  life:'你的觀眾想把時間用在更重要的事上，而我教的是怎麼讓 AI 替他們做掉重複的工作。',
  other:'我覺得你的觀眾會對「用 AI 實際做出成品」這件事有興趣。'};
const OUT={freelance:'一個可以放進作品集、拿去接案的作品',design:'一個完整、可分享的網站作品',shop:'一個屬於自己店面的官網',life:'一個自己能用的小工具或網頁',other:'一個屬於自己的成品'};
const segCat=$('#segCat'),segKind=$('#segKind');
Object.entries(CATS).filter(([k])=>k!=='other').concat([['other','其他']]).forEach(([k,v])=>{const b=document.createElement('button');b.type='button';b.dataset.k=k;b.textContent=v.split('・')[0];b.title=v;b.onclick=()=>{LS.cat=k;compose()};segCat.appendChild(b)});
[['full','首封信'],['dm','私訊短版'],['follow','追蹤信']].forEach(([k,v])=>{const b=document.createElement('button');b.type='button';b.dataset.k=k;b.textContent=v;b.onclick=()=>{LS.kind=k;compose()};segKind.appendChild(b)});
const IDS=['vHost','vChan','vVideo','vMe','vContact','vCourse','vDate','vSeats','vPrice','t1','n2','t2','n3','t3','win'];
const MAP={vMe:'me',vContact:'contact',vCourse:'course',vDate:'date',vSeats:'seats',vPrice:'price',t1:'t1',n2:'n2',t2:'t2',n3:'n3',t3:'t3',win:'win'};
Object.entries(MAP).forEach(([id,k])=>{$('#'+id).value=LS[k]??''});$('#terms').checked=LS.terms;
let curChan=null;
function refreshPick(){const sel=$('#pick');const keep=sel.value;sel.innerHTML='<option value="">（手動填寫）</option>'+CH.filter(c=>!c.sells).map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('');sel.value=CH.some(c=>c.id==keep)?keep:''}
function selectChan(id){refreshPick();$('#pick').value=id;const c=CH.find(x=>x.id==id);if(c){$('#vChan').value=c.name.replace(/^（範例）/,'');LS.cat=c.cat;curChan=c.id;if(c.note&&!$('#vVideo').value)$('#vVideo').placeholder=c.note}}
$('#pick').onchange=e=>{if(e.target.value)selectChan(e.target.value);else curChan=null;compose()};
const V=id=>$('#'+id).value.trim();
const P=(v,ph)=>v||`【${ph}】`;
function terms(){const win=P(V('win'),'歸因天數');return `\n分潤條件\n・分潤比例：基本 ${V('t1')||30}%；單月滿 ${V('n2')||5} 位報名提高到 ${V('t2')||40}%；單月滿 ${V('n3')||15} 位報名提高到 ${V('t3')||50}%\n・歸因期：點選專屬連結後 ${win} 天內報名才計算\n・退費：有退費的報名會扣回該筆分潤，或於退費期結束後才結算\n・範圍：僅計算本場工作坊，後續課程另行討論\n・結算：每月固定日期以匯款方式結算\n・揭露：請依規範在影片與連結說明中標示為合作\n`}
function compose(){
  Object.entries(MAP).forEach(([id,k])=>LS[k]=V(id));LS.terms=$('#terms').checked;store.set('promo-letter',LS);
  $$('#segCat button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===LS.cat));$$('#segKind button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===LS.kind));
  const host=P(V('vHost'),'稱呼'),chan=P(V('vChan'),'頻道名稱'),video=P(V('vVideo'),'影片名稱'),me=P(V('vMe'),'你的名字'),course=P(V('vCourse'),'課程名稱'),date=P(V('vDate'),'日期'),seats=P(V('vSeats'),'名額'),ct=P(V('vContact'),'你的聯絡方式');
  let t='';
  if(LS.kind==='full'){
    t=`主旨：合作邀請：給「${chan}」觀眾的${course}（含免費試上名額）\n\n${host} 你好，\n\n我是 ${me}，平常用 AI 做網站與小工具。看了你的影片「${video}」，${HOOK[LS.cat]}\n\n我正在開一場「${course}」（${date}，線上直播，限 ${seats} 位），帶學員用 AI 從零做出${OUT[LS.cat]}。想邀請你合作，我可以提供三樣東西：\n\n1. 免費試上名額：先讓你完整體驗，覺得適合再推薦給觀眾，不勉強。\n2. 專屬連結與分潤：觀眾透過你的連結報名才計算分潤，沒有人報名，你不需要承擔任何成本。\n3. 現成的影片題材：例如「請 AI 幫一間小店做官網，能做到多好？」我可以提供過程與成品，讓你直接拿去製作內容。\n${$('#terms').checked?terms():''}\n如果主題不太適合你的頻道，直接告訴我也沒關係，我不會再打擾。謝謝你撥空閱讀。\n\n${me}\n聯絡方式：${ct}\n`}
  else if(LS.kind==='dm'){
    t=`${host} 你好，我是 ${me}。看了你的影片「${video}」很有共鳴。\n\n我在開一場「${course}」（${date}），想送你一個免費試上名額，也想提供專屬連結與分潤，還有一支現成的影片題材。可以把詳細內容寄給你嗎？不合適也沒關係，謝謝！`}
  else{
    t=`${host} 你好，\n\n之前寄了一封合作邀請，想確認是不是被埋在信箱裡了。重點很簡單：\n\n・免費試上名額（先體驗再決定）\n・專屬連結與分潤（有報名才計算）\n・現成的影片題材\n\n方便的話回我一句「有興趣」或「不適合」，我就知道怎麼處理，不會再多打擾。謝謝！\n\n${me}\n${ct}`}
  $('#out').value=t;const n=(t.match(/【[^】]+】/g)||[]).length;const pl=$('#todo');pl.className='pill '+(n?'todo':'ok');pl.textContent=n?`還有 ${n} 個【待填】欄位`:'欄位都填好了';
  const price=+V('vPrice'),pc=[+V('t1')||30,+V('t2')||40,+V('t3')||50];
  $('#calc').innerHTML=price?pc.map(p=>`售價 ${price.toLocaleString()}　${p}% → 對方 ${Math.round(price*p/100).toLocaleString()}，你留 ${Math.round(price*(100-p)/100).toLocaleString()}`).join('<br>')+'<br><span style="color:var(--mute)">未扣金流手續費與退費</span>':'<span style="color:var(--mute)">填入售價，這裡會試算每位報名的分潤與你留下的金額</span>'}
[...IDS,'terms'].forEach(id=>$('#'+id).addEventListener('input',compose));
$('#copy').onclick=()=>copyText($('#out').value,$('#out'));
$('#mark').onclick=()=>{if(!curChan){toast('請先在上方「從篩選表帶入頻道」選一個頻道');return}const c=CH.find(x=>x.id==curChan);if(!c)return;c.status='已寄信';const d=new Date();d.setDate(d.getDate()+7);c.next=d.toISOString().slice(0,10);save();render();toast('已標記為已寄信，7 天後提醒追蹤')};

render();refreshPick();compose();
</script>
<script src="common.js"></script>
</body>
</html>
